name: Lee Reader - Debug APK
on:
  push:
    branches: ['feature/lee-reader-v1']
    paths:
      - 'reader/**'
      - 'android-wrapper/**'
      - '.github/workflows/reader-debug-apk.yml'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'reader/**'
      - 'android-wrapper/**'
      - '.github/workflows/reader-debug-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Check whether Reader sources have been committed
        id: source
        run: |
          if [ -f reader/index.html ] && [ -f android-wrapper/package.json ]; then
            echo 'ready=yes' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=no' >> "$GITHUB_OUTPUT"
            echo 'Source files not yet pushed; skip build safely.'
          fi
      - uses: actions/setup-node@v4
        if: steps.source.outputs.ready == 'yes'
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        if: steps.source.outputs.ready == 'yes'
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: android-actions/setup-android@v3
        if: steps.source.outputs.ready == 'yes'
      - name: Install Capacitor and bundle web assets
        if: steps.source.outputs.ready == 'yes'
        working-directory: android-wrapper
        run: |
          npm install --no-audit --no-fund
          test -s www/vendor/jszip.min.js
          test -s www/index.html
          npm run build:web
          npx cap add android
          npx cap sync android
      - name: Build installable debug APK
        if: steps.source.outputs.ready == 'yes'
        working-directory: android-wrapper/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Store debug APK
        if: steps.source.outputs.ready == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: LeeReader-debug-apk
          path: android-wrapper/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error