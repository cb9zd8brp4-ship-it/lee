name: Lee Reader - Debug APK
on:
  push:
    branches: ['feature/lee-reader-v1']
    paths:
      - 'reader/**'
      - 'android-wrapper/**'
      - '.github/workflows/reader-debug-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Verify source exists
        run: |
          test -f reader/index.html
          test -f android-wrapper/package.json
      - name: Install Capacitor and bundle web assets
        working-directory: android-wrapper
        run: |
          npm install --no-audit --no-fund
          npm run build:web
          npx cap add android
          npx cap sync android
      - name: Build installable debug APK
        working-directory: android-wrapper/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Store debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LeeReader-debug-apk
          path: android-wrapper/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error